[package]
name = "game-cabinet"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
# wgpu 后端支持窗口真透明（glow 不行），配合 Windows 亚克力模糊实现拟态玻璃
eframe = { version = "0.27", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
egui = "0.27"
image = "0.25"
rfd = "0.14"
